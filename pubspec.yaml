name: robulingo_flutter
description: "Minimaler RobuLingo-Viewer: Sprache wählen, Curriculum laden, nur Items mit JSON+PNG+MP3 anzeigen."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  audioplayers: ^6.1.0
  flutter_cache_manager: ^3.4.1
  speech_to_text: ^6.6.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/sounds/

dependency_overrides:
  permission_handler_html:
    path: packages/permission_handler_html

