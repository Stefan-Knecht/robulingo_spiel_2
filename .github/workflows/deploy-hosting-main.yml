name: Deploy Hosting Main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Set up Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_ROBULINGO_635C5: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROBULINGO_635C5 }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_ROBULINGO_635C5" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_ROBULINGO_635C5" > "$RUNNER_TEMP/firebase-key.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN=$FIREBASE_TOKEN" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Missing secret: FIREBASE_SERVICE_ACCOUNT_ROBULINGO_635C5 or FIREBASE_TOKEN"
          exit 1

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Robulingo and DailyWords
        run: |
          export SOURCE_REF="$GITHUB_SHA"
          tools/deploy_firebase_hosting.sh prod
