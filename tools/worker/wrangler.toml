name = "robulingo-api"
main = "../cloudflare_worker_log.js"
account_id = "aec343e9a0970f4dcdf10224e7414efb"
compatibility_date = "2026-01-27"

# R2 bindings (must exist in your Cloudflare account)
r2_buckets = [
  { binding = "USERDATA", bucket_name = "userdata", jurisdiction = "eu" },
  { binding = "DAILYWORDSUSERDATA", bucket_name = "dailywordsuserdata", jurisdiction = "eu" },
  { binding = "DAILYWORDSAPK", bucket_name = "dailywords-apk", jurisdiction = "eu" },
  { binding = "HINTS", bucket_name = "hints", jurisdiction = "eu" },
  { binding = "CURRICULUM", bucket_name = "curriculum", jurisdiction = "eu" },
]

[vars]
DAILYWORDS_ACTIVITY_SYNC_URL = "https://www.dailywords-project.org/api/internal/participant-activity"
